[program:adonis-web]
command=/root/anaconda3/bin/python3 /root/project/adonis-deploy/serve.py --current /root/project/adonis-current --releases /root/project/adonis-releases --host 0.0.0.0 --port 8000
directory=/root/project/adonis-deploy
autostart=true
autorestart=true
startsecs=2
startretries=3
stdout_logfile=/tmp/adonis-web.log
stderr_logfile=/tmp/adonis-web.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile_backups=2
environment=PYTHONUNBUFFERED="1"
user=root
stopasgroup=true
killasgroup=true
