[program:adonis-updater]
command=/root/anaconda3/bin/python3 /root/project/adonis-deploy/update.py --config /root/project/adonis-deploy/config.json run
directory=/root/project/adonis-deploy
autostart=true
autorestart=true
startsecs=2
startretries=3
stopwaitsecs=20
stdout_logfile=/tmp/adonis-updater.log
stderr_logfile=/tmp/adonis-updater.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
environment=PATH="/usr/local/bin:/usr/bin:/bin",PYTHONUNBUFFERED="1"
user=root
stopasgroup=true
killasgroup=true
