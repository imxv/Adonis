<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>水体 · 实际渲染样片</title><style>html,body{margin:0;background:#5795bd;color:#f8efda;font:13px/1.5 system-ui}canvas{display:block;width:100vw;height:100dvh}#controls{position:fixed;z-index:2;left:12px;top:12px;display:flex;gap:7px;flex-wrap:wrap;align-items:center;background:#152c35dc;padding:10px;border:1px solid #b6a171}button,select{min-height:38px;padding:6px 12px;background:#324d51;color:#fff3d8;border:1px solid #a18d60;cursor:pointer}#status{position:fixed;left:12px;bottom:12px;max-width:720px;background:#142c36da;padding:10px;white-space:pre-wrap;font:12px/1.4 monospace;pointer-events:none}.clean #controls,.clean #status{display:none}h1{font-size:14px;margin:0 10px 0 0}</style></head><body><div id="controls"><h1>水体实际样片 · 诊断岩台</h1><button data-view="front">固定正面</button><button data-view="side">侧面反射</button><button data-view="near">浅水近景</button><select id="quality" aria-label="水体质量"><option value="high">高档</option><option value="medium">中档</option><option value="low">低档</option></select><button id="pause">暂停动态</button><button id="clean">隐藏面板</button></div><pre id="status" role="status"></pre><script type="module" src="./water-preview.ts"></script></body></html>
