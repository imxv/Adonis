<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自然资产 · 实际模型样片</title><style>html,body{margin:0;background:#748c9a;color:#f2ead8;font:13px/1.5 system-ui,sans-serif}canvas{display:block;width:100vw;height:100dvh}#controls{position:fixed;z-index:2;left:14px;right:14px;top:14px;display:flex;gap:7px;flex-wrap:wrap;align-items:center;background:#13242bdc;padding:12px;border:1px solid #a68d58;border-radius:5px}button,select{min-height:40px;padding:7px 12px;background:#30433f;color:#f8eedc;border:1px solid #a38c5d;cursor:pointer}#status{position:fixed;left:14px;bottom:12px;right:14px;background:#12232cdd;padding:10px;white-space:pre-wrap;font:12px/1.5 monospace;max-height:130px;overflow:auto;pointer-events:none}body.clean #controls,body.clean #status{display:none}h1{font-size:14px;margin:0 14px 0 0}</style></head><body><div id="controls"><h1>实际 3D 模型 · 自然样片</h1><button data-view="tree-front">老树全貌</button><button data-view="tree-close">树干近看</button><button data-view="tree-root">根颈近看</button><button data-view="tree-side">老树侧后</button><button data-view="tree-far">老树远看</button><button data-view="rock-front">岩壁全貌</button><button data-view="rock-close">岩层近看</button><button data-view="rock-side">岩壁侧后</button><button data-view="rock-far">岩壁远看</button><select id="quality" aria-label="模型质量"><option value="high">高档</option><option value="low">低档</option></select><button id="clean">隐藏面板（Esc恢复）</button></div><div id="status" role="status">正在加载实际材质</div><script type="module" src="./nature-preview.ts"></script></body></html>
